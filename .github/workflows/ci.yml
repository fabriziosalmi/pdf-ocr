name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Poppler is needed by TestConversionPipeline, which renders a real PDF
      # end to end (only the OCR call is stubbed). Without it those tests skip
      # silently and the conversion path goes untested.
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m unittest test_app -v

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pdf-ocr:ci .
      # Catches what a build alone cannot: a broken entrypoint, a missing
      # runtime dependency, or an unwritable uploads directory under the
      # non-root user.
      - name: Start container
        run: |
          docker run -d --name pdf-ocr-ci -p 8011:8011 \
            -e SECRET_KEY=ci-only-not-a-real-secret pdf-ocr:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' pdf-ocr-ci)
            if [ "$state" = "healthy" ]; then echo "healthy"; exit 0; fi
            if [ "$state" = "unhealthy" ]; then break; fi
            sleep 2
          done
          echo "container did not become healthy:"
          docker logs pdf-ocr-ci
          exit 1
      - name: Check it runs as a non-root user
        run: |
          uid=$(docker exec pdf-ocr-ci id -u)
          test "$uid" != "0" || { echo "container is running as root"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs pdf-ocr-ci || true
