<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing OCR — Status</title>
    <script src="{{ url_for('static', filename='vendor/tailwindcss/tailwind.js') }}"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth progress transition */
        .progress-bar-fill {
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Subtle indeterminate shimmer */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .progress-indeterminate {
            position: relative;
            overflow: hidden;
        }
        .progress-indeterminate::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 50%, transparent 100%);
            animation: shimmer 1.8s infinite;
        }
    </style>
</head>
<body class="bg-white text-zinc-950 dark:bg-black dark:text-zinc-50 antialiased min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Top Navigation Bar -->
    <header class="border-b border-zinc-200/80 dark:border-zinc-800/80 bg-white/80 dark:bg-black/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="{{ url_for('index') }}" class="flex items-center space-x-2 group">
                    <div class="w-7 h-7 rounded-md bg-zinc-950 text-white dark:bg-zinc-100 dark:text-black flex items-center justify-center font-mono font-bold text-xs tracking-wider shadow-sm transition-transform group-hover:scale-105">
                        OCR
                    </div>
                    <span class="font-semibold text-sm tracking-tight text-zinc-900 dark:text-zinc-100">pdf-ocr</span>
                </a>
                <span class="text-zinc-300 dark:text-zinc-700">/</span>
                <span class="text-xs font-mono px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400 border border-zinc-200 dark:border-zinc-800">Processing</span>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Theme Toggle Button -->
                <button id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme" class="p-1.5 text-zinc-500 hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white rounded-md hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-colors">
                    <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                    </svg>
                    <svg id="theme-toggle-light-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="max-w-lg w-full border border-zinc-200 dark:border-zinc-800 rounded-xl bg-white dark:bg-zinc-950 shadow-sm p-6 sm:p-8 space-y-6">

            <!-- Status Header & Spinner -->
            <div class="text-center space-y-3">
                <div class="w-12 h-12 rounded-full border border-zinc-200 dark:border-zinc-800 mx-auto flex items-center justify-center bg-zinc-50 dark:bg-zinc-900 shadow-sm">
                    <svg class="animate-spin h-6 w-6 text-zinc-950 dark:text-zinc-50" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                        <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
                <div>
                    <h2 id="status-message" class="text-base font-semibold tracking-tight text-zinc-900 dark:text-zinc-100">
                        Processing document...
                    </h2>
                    <p id="substatus-message" class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">
                        Rendering pages and running optical character recognition
                    </p>
                </div>
            </div>

            <!-- 3-Stage Stepper Visualizer -->
            <div class="pt-2 pb-1">
                <div class="flex items-center justify-between text-xs">
                    <!-- Stage 1 -->
                    <div id="stage-convert" class="flex flex-col items-center opacity-40 transition-opacity">
                        <div class="w-7 h-7 rounded-full border border-zinc-300 dark:border-zinc-700 flex items-center justify-center mb-1 text-[11px] font-mono bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200">
                            1
                        </div>
                        <span class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Rendering</span>
                    </div>

                    <div id="line-1" class="flex-1 h-0.5 mx-2 bg-zinc-200 dark:bg-zinc-800 transition-colors"></div>

                    <!-- Stage 2 -->
                    <div id="stage-ocr" class="flex flex-col items-center opacity-40 transition-opacity">
                        <div class="w-7 h-7 rounded-full border border-zinc-300 dark:border-zinc-700 flex items-center justify-center mb-1 text-[11px] font-mono bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200">
                            2
                        </div>
                        <span class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">OCR</span>
                    </div>

                    <div id="line-2" class="flex-1 h-0.5 mx-2 bg-zinc-200 dark:bg-zinc-800 transition-colors"></div>

                    <!-- Stage 3 -->
                    <div id="stage-assemble" class="flex flex-col items-center opacity-40 transition-opacity">
                        <div class="w-7 h-7 rounded-full border border-zinc-300 dark:border-zinc-700 flex items-center justify-center mb-1 text-[11px] font-mono bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200">
                            3
                        </div>
                        <span class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400">Assemble</span>
                    </div>
                </div>
            </div>

            <!-- Progress Bar & Metrics -->
            <div class="space-y-2">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span id="progress-percentage" class="font-semibold text-zinc-900 dark:text-zinc-100">0%</span>
                    <span id="time-remaining" class="text-zinc-500 dark:text-zinc-400">Calculating...</span>
                </div>
                <div class="w-full bg-zinc-100 dark:bg-zinc-900 border border-zinc-200/60 dark:border-zinc-800/60 rounded-full h-2.5 overflow-hidden p-0.5">
                    <div id="progress-bar" class="progress-bar-fill progress-indeterminate bg-zinc-950 dark:bg-zinc-50 h-full rounded-full w-0"></div>
                </div>
            </div>

            <!-- Error Notification Container -->
            <div id="error-container" class="hidden p-4 rounded-lg bg-red-50/70 border border-red-200 text-red-800 dark:bg-red-950/20 dark:border-red-900/60 dark:text-red-300 text-xs space-y-1">
                <p class="font-semibold">Conversion Error</p>
                <p id="error-message" class="leading-relaxed"></p>
            </div>

            <!-- Actions & Cancel -->
            <div class="pt-2 border-t border-zinc-100 dark:border-zinc-900 text-center space-y-3">
                <button type="button" id="cancel-button"
                        class="w-full py-2.5 px-4 text-xs font-medium rounded-lg border border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-900 hover:text-zinc-950 dark:hover:text-white transition-colors">
                    <span id="cancel-button-text">Cancel conversion</span>
                </button>
                <div class="text-[11px] text-zinc-400 dark:text-zinc-500 space-y-1">
                    <p>Cancellation stops after the current page finishes rendering.</p>
                    <p><a href="{{ url_for('index') }}" class="hover:underline">Return to home (conversion continues in background)</a></p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const taskId = "{{ task_id }}";
        let checkInterval = 1000;
        let elapsed = 0;
        const maxTime = 600000; // 10 minutes max
        const cancelButton = document.getElementById('cancel-button');
        const cancelButtonText = document.getElementById('cancel-button-text');
        let networkRetries = 0;
        const maxNetworkRetries = 12;
        let startTime = Date.now();
        let lastProgress = 0;
        let estimatedTimeRemaining = null;

        const stageConvert = document.getElementById('stage-convert');
        const stageOcr = document.getElementById('stage-ocr');
        const stageAssemble = document.getElementById('stage-assemble');
        const line1 = document.getElementById('line-1');
        const line2 = document.getElementById('line-2');
        const progressPercentage = document.getElementById('progress-percentage');
        const progressBar = document.getElementById('progress-bar');
        const timeRemaining = document.getElementById('time-remaining');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const statusMessage = document.getElementById('status-message');
        const substatusMessage = document.getElementById('substatus-message');

        function formatTimeRemaining(seconds) {
            if (seconds < 60) {
                return `${Math.round(seconds)}s remaining`;
            } else if (seconds < 3600) {
                return `${Math.round(seconds / 60)}m remaining`;
            } else {
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.round((seconds % 3600) / 60);
                return `${hours}h ${minutes}m remaining`;
            }
        }

        function updateTimeRemaining(progress) {
            if (progress <= 0 || progress >= 100) {
                timeRemaining.textContent = '';
                return;
            }

            const now = Date.now();
            const timeElapsed = (now - startTime) / 1000;

            if (progress > lastProgress) {
                const timePerProgress = timeElapsed / progress;
                const estimatedTotal = timePerProgress * 100;
                estimatedTimeRemaining = estimatedTotal - timeElapsed;
                lastProgress = progress;

                if (estimatedTimeRemaining > 0) {
                    timeRemaining.textContent = formatTimeRemaining(estimatedTimeRemaining);
                }
            } else if (estimatedTimeRemaining !== null) {
                estimatedTimeRemaining = Math.max(0, estimatedTimeRemaining - (checkInterval / 1000));
                timeRemaining.textContent = estimatedTimeRemaining > 0 ? formatTimeRemaining(estimatedTimeRemaining) : 'Finishing up...';
            }
        }

        function updateStages(step, progress) {
            [stageConvert, stageOcr, stageAssemble].forEach(el => el.classList.add('opacity-40'));
            line1.className = 'flex-1 h-0.5 mx-2 bg-zinc-200 dark:bg-zinc-800 transition-colors';
            line2.className = 'flex-1 h-0.5 mx-2 bg-zinc-200 dark:bg-zinc-800 transition-colors';

            if (progress >= 100) {
                [stageConvert, stageOcr, stageAssemble].forEach(el => el.classList.remove('opacity-40'));
                line1.className = 'flex-1 h-0.5 mx-2 bg-zinc-950 dark:bg-zinc-100 transition-colors';
                line2.className = 'flex-1 h-0.5 mx-2 bg-zinc-950 dark:bg-zinc-100 transition-colors';
            } else if (step === 'converting') {
                stageConvert.classList.remove('opacity-40');
            } else if (step === 'ocr') {
                stageConvert.classList.remove('opacity-40');
                stageOcr.classList.remove('opacity-40');
                line1.className = 'flex-1 h-0.5 mx-2 bg-zinc-950 dark:bg-zinc-100 transition-colors';
            } else if (step === 'assembling') {
                [stageConvert, stageOcr, stageAssemble].forEach(el => el.classList.remove('opacity-40'));
                line1.className = 'flex-1 h-0.5 mx-2 bg-zinc-950 dark:bg-zinc-100 transition-colors';
                line2.className = 'flex-1 h-0.5 mx-2 bg-zinc-950 dark:bg-zinc-100 transition-colors';
            }
        }

        function checkStatus() {
            fetch(`/api/task_status/${taskId}`)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) throw new Error("Task not found");
                        throw new Error(`Server returned ${response.status}`);
                    }
                    networkRetries = 0;
                    return response.json();
                })
                .then(data => {
                    if (data.progress !== undefined) {
                        const prog = Math.min(Math.max(data.progress, 0), 100);
                        progressBar.style.width = `${prog}%`;
                        progressPercentage.textContent = `${prog}%`;
                        updateTimeRemaining(prog);
                    }

                    if (data.step) {
                        updateStages(data.step, data.progress);
                        if (data.step === 'converting') {
                            statusMessage.textContent = 'Rendering PDF pages...';
                            substatusMessage.textContent = 'Extracting high-resolution page buffers with Poppler';
                        } else if (data.step === 'ocr') {
                            statusMessage.textContent = 'Extracting text with OCR...';
                            substatusMessage.textContent = 'Analyzing characters, layout structure, and typography';
                        } else if (data.step === 'assembling') {
                            statusMessage.textContent = 'Assembling final document...';
                            substatusMessage.textContent = 'Writing formatted document and applying clean typography';
                        }
                    }

                    if (data.status === 'completed') {
                        progressBar.style.width = '100%';
                        progressPercentage.textContent = '100%';
                        statusMessage.textContent = 'Conversion complete!';
                        substatusMessage.textContent = 'Redirecting to your download...';
                        setTimeout(() => {
                            window.location.href = data.redirect || `/success/${taskId}`;
                        }, 500);
                        return;
                    }

                    if (data.status === 'failed') {
                        errorContainer.classList.remove('hidden');
                        errorMessage.textContent = data.error || 'The OCR engine encountered an unexpected error.';
                        statusMessage.textContent = 'Conversion failed';
                        substatusMessage.textContent = 'Review the error details below';
                        cancelButton.disabled = true;
                        return;
                    }

                    if (data.status === 'cancelled') {
                        statusMessage.textContent = 'Conversion cancelled';
                        substatusMessage.textContent = 'Redirecting to home...';
                        setTimeout(() => {
                            window.location.href = data.redirect || '/';
                        }, 1000);
                        return;
                    }

                    elapsed += checkInterval;
                    if (elapsed < maxTime) {
                        setTimeout(checkStatus, checkInterval);
                    } else {
                        errorContainer.classList.remove('hidden');
                        errorMessage.textContent = 'Conversion timed out after 10 minutes.';
                    }
                })
                .catch(err => {
                    networkRetries++;
                    if (networkRetries < maxNetworkRetries) {
                        setTimeout(checkStatus, checkInterval * 1.5);
                    } else {
                        errorContainer.classList.remove('hidden');
                        errorMessage.textContent = 'Lost connection to conversion worker: ' + err.message;
                    }
                });
        }

        // Cancel button handler
        cancelButton.addEventListener('click', function() {
            this.disabled = true;
            cancelButtonText.textContent = 'Cancelling...';

            fetch(`/cancel/${taskId}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.cancelled) {
                        statusMessage.textContent = 'Cancelling conversion...';
                        substatusMessage.textContent = 'Stopping after current page finishes';
                    }
                })
                .catch(err => {
                    cancelButtonText.textContent = 'Cancel failed';
                });
        });

        // Start polling
        setTimeout(checkStatus, 500);

        // Theme toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || 
            (!localStorage.getItem('color-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.add('hidden');
            themeToggleDarkIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            themeToggleDarkIcon.classList.add('hidden');
            themeToggleLightIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    </script>
</body>
</html>
